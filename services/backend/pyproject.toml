[project]
name = "research-trail-backend"
version = "0.0.0"
description = "ResearchTrail local fixture market and persistent conversation service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.15,<2",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
    "longbridge==5.2.0",
    "tzdata==2026.5",
]

[dependency-groups]
dev = ["pytest>=8,<10"]
packaging = [
    "pyinstaller==6.22.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
